<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Déclarer un incident</title>

    <!-- Leaflet CSS -->
    <link rel="stylesheet"
          href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .header {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 20px 30px;
            border-radius: 16px;
            margin-bottom: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            animation: slideDown 0.5s ease-out;
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .header h1 {
            font-size: 28px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .user-badge {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            padding: 10px 20px;
            border-radius: 25px;
            font-weight: 600;
            font-size: 14px;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }

        .btn {
            padding: 10px 20px;
            border-radius: 10px;
            text-decoration: none;
            color: white;
            font-weight: 600;
            font-size: 14px;
            transition: all 0.3s ease;
            border: none;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .back-btn {
            background: linear-gradient(135deg, #3b82f6, #2563eb);
            box-shadow: 0 4px 15px rgba(59, 130, 246, 0.3);
        }

        .back-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(59, 130, 246, 0.4);
        }

        .logout-btn {
            background: linear-gradient(135deg, #ef4444, #dc2626);
            box-shadow: 0 4px 15px rgba(239, 68, 68, 0.3);
        }

        .logout-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(239, 68, 68, 0.4);
        }

        .card {
            background: white;
            padding: 40px;
            border-radius: 20px;
            max-width: 1000px;
            margin: 0 auto;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.15);
            animation: fadeInUp 0.6s ease-out;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .form-group {
            margin-bottom: 25px;
        }

        .form-label {
            display: block;
            font-weight: 600;
            color: #374151;
            margin-bottom: 8px;
            font-size: 14px;
        }

        .form-control {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e5e7eb;
            border-radius: 10px;
            font-size: 15px;
            transition: all 0.3s ease;
            font-family: inherit;
        }

        .form-control:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        textarea.form-control {
            resize: vertical;
            min-height: 120px;
        }

        select.form-control {
            cursor: pointer;
            background: white;
        }

        .file-input-wrapper {
            position: relative;
            width: 100%;
        }

        .file-input-label {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 12px 16px;
            background: linear-gradient(135deg, #f9fafb, #f3f4f6);
            border: 2px dashed #d1d5db;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 500;
            color: #6b7280;
        }

        .file-input-label:hover {
            border-color: #667eea;
            background: linear-gradient(135deg, #ede9fe, #ddd6fe);
            color: #667eea;
        }

        .photos-preview {
            margin-top: 12px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            gap: 12px;
        }

        .photo-item {
            position: relative;
            border-radius: 8px;
            overflow: hidden;
            border: 2px solid #e5e7eb;
            background: #f9fafb;
        }

        .photo-item img {
            width: 100%;
            height: 120px;
            object-fit: cover;
        }

        .photo-item .photo-name {
            padding: 6px;
            font-size: 11px;
            color: #6b7280;
            text-align: center;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .photo-item .remove-btn {
            position: absolute;
            top: 4px;
            right: 4px;
            background: #ef4444;
            color: white;
            border: none;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            cursor: pointer;
            font-size: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .photo-item .remove-btn:hover {
            background: #dc2626;
            transform: scale(1.1);
        }

        .map-container {
            margin-bottom: 25px;
        }

        #map {
            height: 400px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            border: 3px solid #e5e7eb;
        }

        .map-hint {
            margin-top: 10px;
            padding: 12px;
            background: linear-gradient(135deg, #fef3c7, #fde68a);
            border-left: 4px solid #f59e0b;
            border-radius: 8px;
            font-size: 14px;
            color: #92400e;
        }

        .submit-btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
            margin-top: 10px;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 25px rgba(102, 126, 234, 0.5);
        }

        .submit-btn:active {
            transform: translateY(0);
        }

        @media (max-width: 768px) {
            .header {
                flex-direction: column;
                gap: 15px;
                text-align: center;
            }

            .header h1 {
                font-size: 24px;
            }

            .user-info {
                flex-wrap: wrap;
                justify-content: center;
            }

            .card {
                padding: 25px;
            }

            #map {
                height: 300px;
            }
        }

        .loading-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(4px);
            z-index: 9999;
            justify-content: center;
            align-items: center;
        }

        .loading-overlay.active {
            display: flex;
        }

        .spinner {
            width: 60px;
            height: 60px;
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>

<body>

<div class="header">
    <h1>➕ Déclarer un incident</h1>

    <div class="user-info">
        <span class="user-badge" sec:authentication="principal.username"></span>

        <a th:href="@{/citoyen/incidents}" class="btn back-btn">
            ⬅️ Mes incidents
        </a>

        <form th:action="@{/logout}" method="post" style="margin:0;">
            <button class="btn logout-btn">🚪 Déconnexion</button>
        </form>
    </div>
</div>

<div class="card">

    <form id="incidentForm"
          th:action="@{/citoyen/incident/ajouter}"
          method="post"
          enctype="multipart/form-data">

        <div class="form-group">
            <label class="form-label">📝 Description de l'incident *</label>
            <textarea class="form-control"
                      name="description"
                      id="description"
                      placeholder="Décrivez l'incident en détail..."
                      required></textarea>
        </div>

        <div class="form-group">
            <label class="form-label">🏷️ Catégorie *</label>
            <select class="form-control" name="categorie" id="categorie" required>
                <option value="">-- Sélectionnez une catégorie --</option>
                <option th:each="c : ${categories}"
                        th:value="${c}"
                        th:text="${c}"></option>
            </select>
        </div>

        <div class="form-group">
            <label class="form-label">🏡 Adresse (optionnel)</label>
            <input class="form-control"
                   type="text"
                   name="adresse"
                   id="adresse"
                   placeholder="Ex: Avenue Habib Bourguiba, Tunis">
        </div>

        <div class="map-container">
            <label class="form-label">📍 Localisation sur la carte *</label>
            <div id="map"></div>
            <div class="map-hint">
                💡 <strong>Astuce :</strong> Cliquez sur la carte pour placer un marqueur ou déplacez-le pour ajuster la position exacte de l'incident.
            </div>
        </div>

        <input type="hidden" name="latitude" id="latitude">
        <input type="hidden" name="longitude" id="longitude">

        <!-- SECTION PHOTOS CORRIGÉE -->
        <div class="form-group">
            <label class="form-label">📸 Photo(s) de l'incident (max 3)</label>
            <div class="file-input-wrapper">
                <label for="photoInput" class="file-input-label">
                    <span style="font-size: 24px;">📷</span>
                    <span>Cliquez pour ajouter des photos (0/3)</span>
                </label>
                <input type="file"
                       id="photoInput"
                       name="photos"
                       accept="image/*"
                       multiple
                       style="display: none;"
                       onchange="handleFileSelect(this)">
            </div>

            <!-- Zone de prévisualisation -->
            <div id="photosPreview" class="photos-preview"></div>
        </div>

        <button type="button" class="submit-btn" onclick="submitForm()">
            ✅ Déclarer l'incident
        </button>

    </form>

</div>

<div class="loading-overlay" id="loadingOverlay">
    <div class="spinner"></div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
    // ========== GESTION DES PHOTOS MULTIPLES ==========
    const MAX_PHOTOS = 3; // Limite maximum de photos
    let selectedFiles = [];

    function handleFileSelect(input) {
        const newFiles = Array.from(input.files);

        // Ajouter les nouveaux fichiers (sans doublons)
        newFiles.forEach(file => {
            // Vérifier la limite
            if (selectedFiles.length >= MAX_PHOTOS) {
                alert(`⚠️ Vous ne pouvez ajouter que ${MAX_PHOTOS} photos maximum.`);
                return;
            }

            const exists = selectedFiles.some(f =>
                f.name === file.name && f.size === file.size && f.lastModified === file.lastModified
            );
            if (!exists && selectedFiles.length < MAX_PHOTOS) {
                selectedFiles.push(file);
            }
        });

        // Afficher les photos
        displayPhotos();
        updateInputState();

        console.log("📸 Fichiers sélectionnés:", selectedFiles.length);
        selectedFiles.forEach((f, i) => {
            console.log(`  ${i + 1}. ${f.name} (${(f.size / 1024).toFixed(1)} KB)`);
        });
    }

    function updateInputState() {
        const input = document.getElementById('photoInput');
        const label = document.querySelector('.file-input-label span:last-child');

        if (selectedFiles.length >= MAX_PHOTOS) {
            input.disabled = true;
            label.textContent = `Maximum atteint (${MAX_PHOTOS}/${MAX_PHOTOS})`;
            document.querySelector('.file-input-label').style.opacity = '0.6';
            document.querySelector('.file-input-label').style.cursor = 'not-allowed';
        } else {
            input.disabled = false;
            label.textContent = `Cliquez pour ajouter des photos (${selectedFiles.length}/${MAX_PHOTOS})`;
            document.querySelector('.file-input-label').style.opacity = '1';
            document.querySelector('.file-input-label').style.cursor = 'pointer';
        }
    }

    function removePhoto(index) {
        selectedFiles.splice(index, 1);
        displayPhotos();
        updateInputState();
        console.log("🗑️ Photo supprimée. Reste:", selectedFiles.length);
    }

    function displayPhotos() {
        const previewDiv = document.getElementById('photosPreview');

        if (selectedFiles.length === 0) {
            previewDiv.innerHTML = '';
            return;
        }

        previewDiv.innerHTML = selectedFiles.map((file, index) => {
            const url = URL.createObjectURL(file);
            return `
                <div class="photo-item">
                    <img src="${url}" alt="${file.name}">
                    <div class="photo-name">${file.name}</div>
                    <button type="button" class="remove-btn" onclick="removePhoto(${index})">✕</button>
                </div>
            `;
        }).join('');
    }

    function submitForm() {
        console.log("🚀 Soumission du formulaire...");

        const form = document.getElementById('incidentForm');
        const formData = new FormData(form);

        // Supprimer les anciennes photos et ajouter les nouvelles
        formData.delete('photos');

        selectedFiles.forEach((file, index) => {
            formData.append('photos', file);
            console.log(`  ✅ Photo ${index + 1} ajoutée: ${file.name} (${file.size} bytes)`);
        });

        // Afficher le loading
        showLoading();

        // Envoyer avec fetch
        fetch(form.action, {
            method: 'POST',
            body: formData
        })
        .then(response => {
            console.log("📡 Réponse reçue:", response.status);
            if (response.redirected) {
                window.location.href = response.url;
            } else if (response.ok) {
                window.location.href = '/citoyen/incident/success';
            } else {
                throw new Error('Erreur HTTP: ' + response.status);
            }
        })
        .catch(error => {
            console.error('❌ Erreur:', error);
            alert('Erreur lors de l\'envoi du formulaire. Veuillez réessayer.');
            hideLoading();
        });
    }

    function showLoading() {
        document.getElementById('loadingOverlay').classList.add('active');
    }

    function hideLoading() {
        document.getElementById('loadingOverlay').classList.remove('active');
    }

    // ========== CARTE LEAFLET ==========
    var map = L.map('map').setView([36.8065, 10.1815], 13);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    var marker;

    if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(function(position) {
            var lat = position.coords.latitude;
            var lng = position.coords.longitude;

            map.setView([lat, lng], 16);

            marker = L.marker([lat, lng], {
                draggable: true,
                title: 'Position de l\'incident (déplaçable)'
            }).addTo(map);

            document.getElementById("latitude").value = lat;
            document.getElementById("longitude").value = lng;

            marker.on('dragend', function(e) {
                var newLatLng = e.target.getLatLng();
                document.getElementById("latitude").value = newLatLng.lat;
                document.getElementById("longitude").value = newLatLng.lng;
            });

        }, function() {
            console.log("⚠️ Impossible de récupérer la position GPS.");
        });
    }

    map.on('click', function(e) {
        var lat = e.latlng.lat;
        var lng = e.latlng.lng;

        if (!marker) {
            marker = L.marker([lat, lng], {
                draggable: true,
                title: 'Position de l\'incident (déplaçable)'
            }).addTo(map);
        } else {
            marker.setLatLng([lat, lng]);
        }

        document.getElementById("latitude").value = lat;
        document.getElementById("longitude").value = lng;
    });
</script>

</body>
</html>
