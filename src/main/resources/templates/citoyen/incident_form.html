<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Déclarer un incident</title>

    <!-- Leaflet CSS -->
    <link rel="stylesheet"
          href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .header {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 20px 30px;
            border-radius: 16px;
            margin-bottom: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            animation: slideDown 0.5s ease-out;
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .header h1 {
            font-size: 28px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .user-badge {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            padding: 10px 20px;
            border-radius: 25px;
            font-weight: 600;
            font-size: 14px;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }

        .btn {
            padding: 10px 20px;
            border-radius: 10px;
            text-decoration: none;
            color: white;
            font-weight: 600;
            font-size: 14px;
            transition: all 0.3s ease;
            border: none;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .back-btn {
            background: linear-gradient(135deg, #3b82f6, #2563eb);
            box-shadow: 0 4px 15px rgba(59, 130, 246, 0.3);
        }

        .back-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(59, 130, 246, 0.4);
        }

        .logout-btn {
            background: linear-gradient(135deg, #ef4444, #dc2626);
            box-shadow: 0 4px 15px rgba(239, 68, 68, 0.3);
        }

        .logout-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(239, 68, 68, 0.4);
        }

        .card {
            background: white;
            padding: 40px;
            border-radius: 20px;
            max-width: 1000px;
            margin: 0 auto;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.15);
            animation: fadeInUp 0.6s ease-out;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .alert {
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
            animation: slideDown 0.3s ease-out;
        }

        .alert-danger {
            background: #fee2e2;
            border-left: 4px solid #ef4444;
            color: #991b1b;
        }

        .alert-danger ul {
            margin: 8px 0 0 20px;
        }

        .alert-danger li {
            margin: 4px 0;
        }

        .form-group {
            margin-bottom: 25px;
            position: relative;
        }

        .form-label {
            display: block;
            font-weight: 600;
            color: #374151;
            margin-bottom: 8px;
            font-size: 14px;
        }

        .form-label .required {
            color: #ef4444;
            margin-left: 2px;
        }

        .form-control {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e5e7eb;
            border-radius: 10px;
            font-size: 15px;
            transition: all 0.3s ease;
            font-family: inherit;
        }

        .form-control:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .form-control.is-invalid {
            border-color: #ef4444;
            background-color: #fef2f2;
        }

        .form-control.is-invalid:focus {
            border-color: #ef4444;
            box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.1);
        }

        .form-control.is-valid {
            border-color: #10b981;
            background-color: #f0fdf4;
        }

        .invalid-feedback {
            display: none;
            color: #dc2626;
            font-size: 13px;
            margin-top: 6px;
            font-weight: 500;
        }

        .invalid-feedback.d-block {
            display: block;
        }

        .char-counter {
            font-size: 12px;
            color: #6b7280;
            margin-top: 4px;
            text-align: right;
        }

        .char-counter.warning {
            color: #f59e0b;
        }

        .char-counter.danger {
            color: #ef4444;
        }

        textarea.form-control {
            resize: vertical;
            min-height: 120px;
        }

        select.form-control {
            cursor: pointer;
            background: white;
        }

        .file-input-wrapper {
            position: relative;
            width: 100%;
        }

        .file-input-label {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 12px 16px;
            background: linear-gradient(135deg, #f9fafb, #f3f4f6);
            border: 2px dashed #d1d5db;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 500;
            color: #6b7280;
        }

        .file-input-label:hover {
            border-color: #667eea;
            background: linear-gradient(135deg, #ede9fe, #ddd6fe);
            color: #667eea;
        }

        .file-input-label.is-invalid {
            border-color: #ef4444;
            background-color: #fef2f2;
        }

        .photos-preview {
            margin-top: 12px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            gap: 12px;
        }

        .photo-item {
            position: relative;
            border-radius: 8px;
            overflow: hidden;
            border: 2px solid #e5e7eb;
            background: #f9fafb;
        }

        .photo-item img {
            width: 100%;
            height: 120px;
            object-fit: cover;
        }

        .photo-item .photo-name {
            padding: 6px;
            font-size: 11px;
            color: #6b7280;
            text-align: center;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .photo-item .remove-btn {
            position: absolute;
            top: 4px;
            right: 4px;
            background: #ef4444;
            color: white;
            border: none;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            cursor: pointer;
            font-size: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .photo-item .remove-btn:hover {
            background: #dc2626;
            transform: scale(1.1);
        }

        .map-container {
            margin-bottom: 25px;
        }

        #map {
            height: 400px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            border: 3px solid #e5e7eb;
        }

        #map.is-invalid {
            border-color: #ef4444;
        }

        .map-hint {
            margin-top: 10px;
            padding: 12px;
            background: linear-gradient(135deg, #fef3c7, #fde68a);
            border-left: 4px solid #f59e0b;
            border-radius: 8px;
            font-size: 14px;
            color: #92400e;
        }

        .submit-btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
            margin-top: 10px;
        }

        .submit-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 6px 25px rgba(102, 126, 234, 0.5);
        }

        .submit-btn:active:not(:disabled) {
            transform: translateY(0);
        }

        .submit-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        @media (max-width: 768px) {
            .header {
                flex-direction: column;
                gap: 15px;
                text-align: center;
            }

            .header h1 {
                font-size: 24px;
            }

            .user-info {
                flex-wrap: wrap;
                justify-content: center;
            }

            .card {
                padding: 25px;
            }

            #map {
                height: 300px;
            }
        }

        .loading-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(4px);
            z-index: 9999;
            justify-content: center;
            align-items: center;
        }

        .loading-overlay.active {
            display: flex;
        }

        .spinner {
            width: 60px;
            height: 60px;
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>

<body>

<div th:replace="fragments/header_citoyen :: citoyen-header"></div>

<div class="card">

    <!-- ========== AFFICHAGE DES ERREURS SERVEUR ========== -->
    <div th:if="${#fields.hasErrors('incident')}" class="alert alert-danger">
        <strong>⚠️ Erreurs de validation :</strong>
        <ul>
            <li th:each="err : ${#fields.errors('incident')}" th:text="${err}"></li>
        </ul>
    </div>

    <form id="incidentForm"
          th:action="@{/citoyen/incident/ajouter}"
          th:object="${incident}"
          method="post"
          enctype="multipart/form-data"
          novalidate>

        <!-- DESCRIPTION -->
        <div class="form-group">
            <label class="form-label">
                📝 Description de l'incident
                <span class="required">*</span>
            </label>
            <textarea class="form-control"
                      th:field="*{description}"
                      id="description"
                      placeholder="Décrivez l'incident en détail..."
                      minlength="10"
                      maxlength="1000"
                      required></textarea>
            <div class="char-counter" id="descriptionCounter">0 / 1000 caractères</div>
            <div class="invalid-feedback" th:errors="*{description}"></div>
        </div>


        <!-- DÉPARTEMENT (Catégorie dynamique) -->
        <div class="form-group">
            <label class="form-label">
                🏷️ Catégorie (Département)
                <span class="required">*</span>
            </label>

            <select class="form-control"
                    th:field="*{departementId}"
                    required>
                <option value="" disabled selected>
                    -- Sélectionnez un département --
                </option>

                <option th:each="d : ${departements}"
                        th:value="${d.id}"
                        th:text="${d.nom}">
                </option>
            </select>


            <div class="invalid-feedback"
                 th:errors="*{departementId}">
                Veuillez sélectionner un département
            </div>
        </div>


        <!-- QUARTIER -->
        <div class="form-group">
            <label class="form-label">
                📍 Quartier
                <span class="required">*</span>
            </label>

            <select class="form-control"
                    th:field="*{quartierId}"
                    id="quartierId"
                    required>
                <option value="">-- Sélectionnez un quartier --</option>

                <option th:each="q : ${quartiers}"
                        th:value="${q.id}"
                        th:text="${q.nom}">
                </option>
            </select>

            <div class="invalid-feedback"
                 th:errors="*{quartierId}">
                Veuillez sélectionner un quartier
            </div>
        </div>


        <!-- CARTE -->
        <div class="map-container">
            <label class="form-label">
                📍 Localisation sur la carte
                <span class="required">*</span>
            </label>
            <div id="map"></div>
            <div class="map-hint">
                💡 <strong>Astuce :</strong> Cliquez sur la carte pour placer un marqueur ou déplacez-le pour ajuster la position exacte de l'incident.
            </div>
            <div class="invalid-feedback" id="mapError">
                Veuillez sélectionner une position sur la carte
            </div>
        </div>

        <input type="hidden" th:field="*{latitude}" id="latitude">
        <input type="hidden" th:field="*{longitude}" id="longitude">

        <!-- PHOTOS -->
        <div class="form-group">
            <label class="form-label">
                📸 Photo(s) de l'incident
                <span class="required">*</span>
            </label>
            <div class="file-input-wrapper">
                <label for="photoInput" class="file-input-label" id="photoInputLabel">
                    <span style="font-size: 24px;">📷</span>
                    <span id="photoLabel">Cliquez pour ajouter des photos (0/3)</span>
                </label>
                <input type="file"
                       id="photoInput"
                       name="photos"
                       accept="image/*"
                       multiple
                       style="display: none;">
            </div>
            <div id="photosPreview" class="photos-preview"></div>

            <!-- ✅ ERREUR BACKEND (Bean Validation) -->
            <div class="invalid-feedback d-block"
                 th:if="${#fields.hasErrors('photos')}"
                 th:errors="*{photos}">
            </div>

            <div class="invalid-feedback" id="photoError"></div>
        </div>

        <button type="submit" class="submit-btn" id="submitBtn">
            ✅ Déclarer l'incident
        </button>

    </form>

</div>

<div class="loading-overlay" id="loadingOverlay">
    <div class="spinner"></div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
    // ========== CONFIGURATION ==========
    const MAX_PHOTOS = 3;
    const MIN_DESCRIPTION = 10;
    const MAX_DESCRIPTION = 1000;
    const MIN_ADRESSE = 5;
    const MAX_ADRESSE = 255;

    let selectedFiles = [];
    let formSubmitted = false;

    // ========== VALIDATION EN TEMPS RÉEL ==========

    // Description avec compteur
    const descriptionField = document.getElementById('description');
    const descriptionCounter = document.getElementById('descriptionCounter');

    descriptionField.addEventListener('input', function() {
        const length = this.value.length;
        descriptionCounter.textContent = `${length} / ${MAX_DESCRIPTION} caractères`;

        if (length < MIN_DESCRIPTION) {
            descriptionCounter.classList.add('danger');
            descriptionCounter.classList.remove('warning');
        } else if (length > MAX_DESCRIPTION - 50) {
            descriptionCounter.classList.add('warning');
            descriptionCounter.classList.remove('danger');
        } else {
            descriptionCounter.classList.remove('warning', 'danger');
        }

        validateField(this);
    });

    // Validation des autres champs
    ['categorie', 'adresse'].forEach(fieldId => {
        const field = document.getElementById(fieldId);
        if (field) {
            field.addEventListener('blur', function() {
                validateField(this);
            });
            field.addEventListener('change', function() {
                validateField(this);
            });
        }
    });

    function validateField(field) {
        const errorDiv = field.parentElement.querySelector('.invalid-feedback');

        if (!field.checkValidity()) {
            field.classList.add('is-invalid');
            field.classList.remove('is-valid');
            if (errorDiv) errorDiv.classList.add('d-block');
            return false;
        } else {
            field.classList.remove('is-invalid');
            field.classList.add('is-valid');
            if (errorDiv) errorDiv.classList.remove('d-block');
            return true;
        }
    }

    // ========== GESTION DES PHOTOS ==========
    document.getElementById('photoInput').addEventListener('change', function(e) {
        const newFiles = Array.from(e.target.files);

        newFiles.forEach(file => {
            if (selectedFiles.length >= MAX_PHOTOS) {
                showPhotoError(`⚠️ Maximum ${MAX_PHOTOS} photos autorisées`);
                return;
            }

            // Vérifier le type
            if (!file.type.startsWith('image/')) {
                showPhotoError(`⚠️ ${file.name} n'est pas une image valide`);
                return;
            }

            // Vérifier la taille (max 5MB)
            if (file.size > 5 * 1024 * 1024) {
                showPhotoError(`⚠️ ${file.name} est trop volumineux (max 5MB)`);
                return;
            }

            const exists = selectedFiles.some(f =>
                f.name === file.name && f.size === file.size
            );

            if (!exists && selectedFiles.length < MAX_PHOTOS) {
                selectedFiles.push(file);
            }
        });

        displayPhotos();
        updatePhotoLabel();
        validatePhotos(); // ✅ VALIDATION AUTOMATIQUE
        e.target.value = ''; // Reset input
    });

    function showPhotoError(message) {
        const errorDiv = document.getElementById('photoError');
        errorDiv.textContent = message;
        errorDiv.classList.add('d-block');
        setTimeout(() => {
            errorDiv.classList.remove('d-block');
        }, 3000);
    }

    function updatePhotoLabel() {
        const input = document.getElementById('photoInput');
        const label = document.getElementById('photoLabel');

        if (selectedFiles.length >= MAX_PHOTOS) {
            input.disabled = true;
            label.textContent = `Maximum atteint (${MAX_PHOTOS}/${MAX_PHOTOS})`;
            document.querySelector('.file-input-label').style.opacity = '0.6';
        } else {
            input.disabled = false;
            label.textContent = `Cliquez pour ajouter des photos (${selectedFiles.length}/${MAX_PHOTOS})`;
            document.querySelector('.file-input-label').style.opacity = '1';
        }
    }

    function removePhoto(index) {
        selectedFiles.splice(index, 1);
        displayPhotos();
        updatePhotoLabel();
        validatePhotos(); // ✅ RE-VALIDER après suppression
    }

    function displayPhotos() {
        const previewDiv = document.getElementById('photosPreview');

        if (selectedFiles.length === 0) {
            previewDiv.innerHTML = '';
            return;
        }

        previewDiv.innerHTML = selectedFiles.map((file, index) => {
            const url = URL.createObjectURL(file);
            return `
                <div class="photo-item">
                    <img src="${url}" alt="${file.name}">
                    <div class="photo-name">${file.name}</div>
                    <button type="button" class="remove-btn" onclick="removePhoto(${index})">✕</button>
                </div>
            `;
        }).join('');
    }

    // ✅ NOUVELLE FONCTION : VALIDER LES PHOTOS
    function validatePhotos() {
        const photoError = document.getElementById('photoError');
        const photoInputLabel = document.getElementById('photoInputLabel');

        if (selectedFiles.length === 0) {
            photoInputLabel.classList.add('is-invalid');
            photoError.textContent = '⚠️ Au moins une photo est obligatoire';
            photoError.classList.add('d-block');
            return false;
        } else {
            photoInputLabel.classList.remove('is-invalid');
            photoError.classList.remove('d-block');
            return true;
        }
    }

    // ========== VALIDATION COMPLÈTE DU FORMULAIRE ==========
    document.getElementById('incidentForm').addEventListener('submit', function(e) {
        e.preventDefault();

        if (formSubmitted) return;

        let isValid = true;
        const form = this;

        // Valider tous les champs
        ['description', 'departementId', 'quartierId'].forEach(fieldId => {
            const field = document.getElementById(fieldId);
            if (field && !validateField(field)) {
                isValid = false;
            }
        });

        // Valider la carte
        const latitude = document.getElementById('latitude').value;
        const longitude = document.getElementById('longitude').value;
        const mapError = document.getElementById('mapError');
        const mapElement = document.getElementById('map');

        if (!latitude || !longitude) {
            mapElement.classList.add('is-invalid');
            mapError.classList.add('d-block');
            isValid = false;
        } else {
            mapElement.classList.remove('is-invalid');
            mapError.classList.remove('d-block');
        }

        // ✅ VALIDATION DES PHOTOS AVANT SOUMISSION
        if (!validatePhotos()) {
            isValid = false;
        }

        // Si invalide, scroll vers la première erreur
        if (!isValid) {
            const firstError = form.querySelector('.is-invalid');
            if (firstError) {
                firstError.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }
            return;
        }

        // ✅ Formulaire valide → soumission
        formSubmitted = true;
        submitForm(form);
    });

    function submitForm(form) {
        const submitBtn = document.getElementById('submitBtn');
        submitBtn.disabled = true;
        submitBtn.textContent = '⏳ Envoi en cours...';

        const formData = new FormData(form);

        // Supprimer les anciennes photos et ajouter les nouvelles
        formData.delete('photos');
        selectedFiles.forEach(file => {
            formData.append('photos', file);
        });

        // Afficher le loading
        document.getElementById('loadingOverlay').classList.add('active');

        // Envoyer avec fetch
        fetch(form.action, {
            method: 'POST',
            body: formData
        }).then(response => {
    if (!response.ok) {
        throw new Error('Erreur HTTP: ' + response.status);
    }

    // ✅ SUCCÈS
    console.log("✅ Incident créé avec succès");

    // Réinitialiser le formulaire
    form.reset();
    selectedFiles = [];
    displayPhotos();
    updatePhotoLabel();

    // 🔓 RÉACTIVER LE BOUTON
    formSubmitted = false;
    submitBtn.disabled = false;
    submitBtn.textContent = '✅ Déclarer l\'incident';

    // ❌ Enlever le loading
    document.getElementById('loadingOverlay').classList.remove('active');

    // (optionnel) feedback simple
    // alert("✅ Incident déclaré avec succès");
})



        .catch(error => {
            console.error('❌ Erreur:', error);
            alert('❌ Erreur lors de l\'envoi. Veuillez réessayer.');

            formSubmitted = false;
            submitBtn.disabled = false;
            submitBtn.textContent = '✅ Déclarer l\'incident';
            document.getElementById('loadingOverlay').classList.remove('active');
        });
    }

    // ========== CARTE LEAFLET ==========
    var map = L.map('map').setView([36.8065, 10.1815], 13);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    var marker;

    // Géolocalisation automatique
    if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(function(position) {
            var lat = position.coords.latitude;
            var lng = position.coords.longitude;

            map.setView([lat, lng], 16);

            marker = L.marker([lat, lng], {
                draggable: true,
                title: 'Position de l\'incident (déplaçable)'
            }).addTo(map);

            updateCoordinates(lat, lng);

            marker.on('dragend', function(e) {
                var newLatLng = e.target.getLatLng();
                updateCoordinates(newLatLng.lat, newLatLng.lng);
            });

        }, function() {
            console.log("⚠️ Géolocalisation refusée");
        });
    }

    // Clic sur la carte
    map.on('click', function(e) {
        var lat = e.latlng.lat;
        var lng = e.latlng.lng;

        if (!marker) {
            marker = L.marker([lat, lng], {
                draggable: true,
                title: 'Position de l\'incident (déplaçable)'
            }).addTo(map);

            marker.on('dragend', function(e) {
                var newLatLng = e.target.getLatLng();
                updateCoordinates(newLatLng.lat, newLatLng.lng);
            });
        } else {
            marker.setLatLng([lat, lng]);
        }

        updateCoordinates(lat, lng);
    });

    function updateCoordinates(lat, lng) {
        document.getElementById("latitude").value = lat;
        document.getElementById("longitude").value = lng;

        // Retirer l'erreur si présente
        const mapElement = document.getElementById('map');
        const mapError = document.getElementById('mapError');
        mapElement.classList.remove('is-invalid');
        mapError.classList.remove('d-block');
    }
</script>

</body>
</html>
