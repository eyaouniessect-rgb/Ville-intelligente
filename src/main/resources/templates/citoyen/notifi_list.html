<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Mes notifications</title>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            min-height: 100vh;
            padding: 30px;
        }

        .container { max-width: 900px; margin: auto; }

        .card {
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .header h2 { color: #4f46e5; }

        .badge {
            background: #ef4444;
            color: white;
            padding: 6px 14px;
            border-radius: 999px;
            font-size: 14px;
            font-weight: bold;
        }

        .notification {
            padding: 15px 20px;
            border-radius: 12px;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .notification.unread {
            background: #eef2ff;
            border-left: 6px solid #4f46e5;
        }

        .notification.read {
            background: #f9fafb;
            opacity: 0.7;
        }

        .notif-content { max-width: 70%; }

        .notif-message {
            font-weight: 600;
            color: #1f2937;
            margin-bottom: 6px;
        }

        .notif-date {
            font-size: 13px;
            color: #6b7280;
        }

        .btn {
            background: #4f46e5;
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
        }

        .btn:hover { background: #4338ca; }

        .empty {
            text-align: center;
            color: #6b7280;
            padding: 40px;
        }
    </style>
</head>

<body>

<div class="container">
    <div class="card">

        <div class="header">
            <h2>🔔 Mes notifications</h2>
            <span class="badge" th:text="${nbNonLues} + ' non lues'"></span>
        </div>

        <div th:if="${#lists.isEmpty(notifications)}" class="empty">
            Aucune notification pour le moment 🙂
        </div>

        <div th:each="n : ${notifications}"
             th:class="'notification ' + (${n.lu} ? 'read' : 'unread')">

            <div class="notif-content">
                <div class="notif-message" th:text="${n.message}"></div>
                <div class="notif-date"
                     th:text="${#temporals.format(n.dateEnvoi, 'dd/MM/yyyy HH:mm')}">
                </div>
            </div>

            <form th:if="${!n.lu}"
                  th:action="@{/citoyen/notifications/{id}/lu(id=${n.id})}"
                  method="post">
                <button class="btn" type="submit">Marquer comme lue</button>
            </form>

        </div>

    </div>
</div>

</body>
</html>
