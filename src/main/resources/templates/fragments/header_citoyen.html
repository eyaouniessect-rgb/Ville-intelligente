<!DOCTYPE html>
<html xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
</head>
<body>

<div th:fragment="citoyen-header">

    <style>
        /* ===== HEADER STYLES ===== */
        .header-container {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 20px 40px;
            border-radius: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 8px 32px rgba(0,0,0,0.1);
            margin-bottom: 30px;
            position: relative;
            z-index: 1000;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .header-title {
            background: linear-gradient(135deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-size: 28px;
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 12px;
            transition: all 0.3s ease;
        }

        .header-left a {
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .header-left a:hover .header-title {
            opacity: 0.8;
            transform: scale(1.02);
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .user-name {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            padding: 10px 20px;
            border-radius: 25px;
            font-weight: 600;
            font-size: 14px;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);
        }

        .notification-icon-container {
            position: relative;
            cursor: pointer;
        }

        .notification-icon {
            font-size: 24px;
            color: #667eea;
            background: rgba(102, 126, 234, 0.1);
            padding: 10px;
            border-radius: 50%;
            width: 45px;
            height: 45px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }

        .notification-icon:hover {
            background: rgba(102, 126, 234, 0.2);
            transform: scale(1.1);
        }

        .notification-badge {
            position: absolute;
            top: -2px;
            right: -2px;
            background: linear-gradient(135deg, #ef4444, #dc2626);
            color: white;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            font-weight: bold;
            box-shadow: 0 2px 8px rgba(239, 68, 68, 0.4);
            animation: pulse 2s infinite;
        }

        .notification-badge.hidden {
            display: none;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        .logout-btn {
            background: linear-gradient(135deg, #ef4444, #dc2626);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 25px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(239, 68, 68, 0.3);
        }

        .logout-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(239, 68, 68, 0.4);
        }

        /* ===== DEBUG PANEL ===== */
        .debug-panel {
            position: fixed;
            bottom: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.9);
            color: #00ff00;
            padding: 15px;
            border-radius: 10px;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            max-width: 400px;
            max-height: 300px;
            overflow-y: auto;
            z-index: 10001;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
        }

        .debug-panel h4 {
            color: #fff;
            margin: 0 0 10px 0;
            border-bottom: 1px solid #00ff00;
            padding-bottom: 5px;
        }

        .debug-log {
            margin: 5px 0;
        }

        .debug-error {
            color: #ff4444;
        }

        .debug-success {
            color: #00ff00;
        }

        .debug-warning {
            color: #ffaa00;
        }

        /* ===== NOTIFICATION TOAST STYLES ===== */
        .notification-toast {
            position: fixed;
            top: 20px;
            right: 20px;
            background: white;
            border-radius: 16px;
            padding: 20px 25px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.15);
            min-width: 350px;
            max-width: 450px;
            z-index: 10000;
            display: none;
            animation: slideInRight 0.5s ease-out, fadeOut 0.5s ease-out 4.5s;
            border-left: 5px solid #667eea;
            transform: translateX(500px);
            opacity: 0;
        }

        .notification-toast.show {
            display: block;
            transform: translateX(0);
            opacity: 1;
        }

        @keyframes slideInRight {
            from {
                transform: translateX(500px);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        @keyframes fadeOut {
            from {
                opacity: 1;
                transform: translateX(0);
            }
            to {
                opacity: 0;
                transform: translateX(500px);
            }
        }

        .toast-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 10px;
        }

        .toast-icon {
            font-size: 28px;
            margin-right: 12px;
        }

        .toast-title {
            font-size: 18px;
            font-weight: 700;
            color: #1f2937;
            display: flex;
            align-items: center;
            gap: 10px;
            flex: 1;
        }

        .toast-close {
            background: none;
            border: none;
            font-size: 20px;
            cursor: pointer;
            color: #9ca3af;
            padding: 0;
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            transition: all 0.2s ease;
        }

        .toast-close:hover {
            background: #f3f4f6;
            color: #374151;
        }

        .toast-message {
            color: #4b5563;
            font-size: 14px;
            line-height: 1.6;
            margin-left: 40px;
        }

        .toast-progress {
            position: absolute;
            bottom: 0;
            left: 0;
            height: 3px;
            background: linear-gradient(90deg, #667eea, #764ba2);
            border-radius: 0 0 16px 16px;
            animation: progress 5s linear;
        }

        @keyframes progress {
            from { width: 100%; }
            to { width: 0%; }
        }

        /* Notification variants */
        .notification-toast.CREATION_INCIDENT {
            border-left-color: #10b981;
        }

        .notification-toast.CREATION_INCIDENT .toast-icon {
            color: #10b981;
        }

        .notification-toast.CHANGEMENT_STATUT {
            border-left-color: #3b82f6;
        }

        .notification-toast.CHANGEMENT_STATUT .toast-icon {
            color: #3b82f6;
        }

        .notification-toast.ASSIGNATION {
            border-left-color: #8b5cf6;
        }

        .notification-toast.ASSIGNATION .toast-icon {
            color: #8b5cf6;
        }
    </style>

    <!-- Header Container -->
    <div class="header-container">
        <div class="header-left">
            <a th:href="@{/citoyen/home}">
                <span class="header-title">👤 Dashboard Citoyen</span>
            </a>
        </div>

        <div class="header-right">
            <span class="user-name"
                  th:text="${utilisateur != null ? utilisateur.prenom + ' ' + utilisateur.nom : 'Utilisateur'}">
                Nom Utilisateur
            </span>

            <div class="notification-icon-container" onclick="toggleNotifications()" th:if="${utilisateur != null}">
                <div class="notification-icon">🔔</div>
                <span class="notification-badge hidden" id="notificationBadge">0</span>
            </div>

            <form th:action="@{/logout}" method="post" style="margin: 0;">
                <button type="submit" class="logout-btn">🚪 Déconnexion</button>
            </form>
        </div>
    </div>



    <!-- Notification Toast Container -->
    <div id="notificationToast" class="notification-toast CREATION_INCIDENT">
        <div class="toast-progress"></div>
        <div class="toast-header">
            <div class="toast-title">
                <span class="toast-icon">✅</span>
                <span>Incident créé</span>
            </div>
            <button class="toast-close" onclick="closeNotification()">×</button>
        </div>
        <div class="toast-message" id="toastMessage"></div>
    </div>

    <!-- WebSocket Notifications Script -->
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>

    <script th:if="${utilisateur != null}" th:inline="javascript">

        let stompClient = null;
        let notificationCount = 0;

        // 👉 THYMELEAF FONCTIONNE MAINTENANT
        const userId = [[${utilisateur.id}]];

        function debug(msg) { console.log("WS >> " + msg); }

        function initWebSocket() {

            if (!userId) {
                debug("❌ UTILISATEUR ID NULL → WebSocket ignoré");
                return;
            }

            debug("🔌 Connexion WebSocket pour user " + userId);

            const socket = new SockJS('/ws-notifications');
            stompClient = Stomp.over(socket);

            stompClient.connect({}, function () {

                debug("✅ WebSocket CONNECTÉ");

                const topic = "/topic/notifications/" + userId;
                debug("📡 Souscription : " + topic);

                stompClient.subscribe(topic, function (msg) {

                    debug("📨 MESSAGE REÇU : " + msg.body);

                    let data;

                    try {
                        data = JSON.parse(msg.body);
                    } catch (e) {
                        data = { message: msg.body, type: "CREATION_INCIDENT" };
                    }

                    showNotification(data.message, data.type);
                });

            }, function (error) {
                debug("❌ Erreur WebSocket : " + error);
                setTimeout(initWebSocket, 5000);
            });
        }

        function showNotification(message, type) {
            debug("🔔 Notification : " + message);

            const toast = document.getElementById("notificationToast");
            const msg = document.getElementById("toastMessage");

            toast.classList.remove("CREATION_INCIDENT", "CHANGEMENT_STATUT", "ASSIGNATION");
            toast.classList.add(type);

            msg.textContent = message;

            toast.classList.add("show");

            notificationCount++;
            updateNotificationBadge();

            setTimeout(() => toast.classList.remove("show"), 5000);
        }

        function updateNotificationBadge() {
            const badge = document.getElementById("notificationBadge");
            badge.textContent = notificationCount;
            badge.classList.remove("hidden");
        }

        document.addEventListener("DOMContentLoaded", initWebSocket);

    </script>



</div>

</body>
</html>
