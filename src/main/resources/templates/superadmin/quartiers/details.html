<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="'Quartier ' + ${quartier.nom} + ' - Ville Intelligente'">Détails Quartier</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container { max-width: 1200px; margin: 0 auto; }

        .header {
            background: white;
            border-radius: 10px;
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .back-link {
            color: #667eea;
            text-decoration: none;
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }

        .back-link:hover { text-decoration: underline; }

        .header-actions {
            display: flex;
            gap: 10px;
        }

        .btn {
            padding: 10px 20px;
            border-radius: 5px;
            text-decoration: none;
            font-weight: bold;
            transition: all 0.3s;
            border: none;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: white;
        }

        .btn-danger {
            background: #ef4444;
            color: white;
        }

        .btn:hover { transform: translateY(-2px); }

        .quartier-title {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 15px;
        }

        .quartier-title h1 {
            color: #1f2937;
            font-size: 32px;
        }

        .quartier-icon {
            font-size: 40px;
        }

        .quartier-info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }

        .info-item {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .info-icon {
            font-size: 20px;
            width: 35px;
            height: 35px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f3f4f6;
            border-radius: 8px;
        }

        .info-content h4 {
            font-size: 12px;
            color: #6b7280;
            margin-bottom: 3px;
            text-transform: uppercase;
        }

        .info-content p {
            color: #1f2937;
            font-weight: 500;
        }

        .alert {
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .alert-success {
            background: #d1fae5;
            color: #065f46;
            border: 1px solid #a7f3d0;
        }

        .alert-error {
            background: #fee2e2;
            color: #991b1b;
            border: 1px solid #fecaca;
        }

        .section {
            background: white;
            border-radius: 10px;
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid #e5e7eb;
        }

        .section-header h2 {
            color: #1f2937;
            font-size: 24px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .count-badge {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 14px;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #6b7280;
        }

        .empty-state .icon {
            font-size: 80px;
            margin-bottom: 20px;
            opacity: 0.5;
        }

        .empty-state h3 {
            font-size: 24px;
            color: #1f2937;
            margin-bottom: 10px;
        }

        @media (max-width: 768px) {
            .header-top {
                flex-direction: column;
                gap: 15px;
                align-items: flex-start;
            }

            .header-actions {
                width: 100%;
                flex-direction: column;
            }

            .btn {
                width: 100%;
                justify-content: center;
            }

            .quartier-info-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
<div class="container">
    <!-- Header avec infos du quartier -->
    <div class="header">
        <div class="header-top">
            <a th:href="@{/superadmin/quartiers}" class="back-link">
                ← Retour à la liste
            </a>
            <div class="header-actions">
                <a th:href="@{/superadmin/quartiers/{id}/edit(id=${quartier.id})}"
                   class="btn btn-primary">
                    ✏️ Modifier
                </a>
                <form th:action="@{/superadmin/quartiers/{id}/delete(id=${quartier.id})}"
                      method="post"
                      style="margin: 0;"
                      onsubmit="return confirm('⚠️ ATTENTION : Voulez-vous vraiment supprimer ce quartier ? Cette action est irréversible.');">
                    <button type="submit" class="btn btn-danger">
                        🗑️ Supprimer
                    </button>
                </form>
            </div>
        </div>

        <div class="quartier-title">
            <span class="quartier-icon">🏘️</span>
            <h1 th:text="${quartier.nom}">Nom du Quartier</h1>
        </div>

        <div class="quartier-info-grid">
            <div class="info-item">
                <div class="info-icon">📮</div>
                <div class="info-content">
                    <h4>Code Postal</h4>
                    <p th:text="${quartier.codePostal}">1000</p>
                </div>
            </div>

            <div class="info-item">
                <div class="info-icon">📋</div>
                <div class="info-content">
                    <h4>Incidents</h4>
                    <p><strong th:text="${quartier.nombreIncidents}">0</strong> incident(s)</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Messages -->
    <div class="alert alert-success" th:if="${success}">
        ✓ <span th:text="${success}"></span>
    </div>

    <div class="alert alert-error" th:if="${error}">
        ✗ <span th:text="${error}"></span>
    </div>

    <!-- Section des incidents (optionnel) -->
    <div class="section" th:if="${quartier.nombreIncidents > 0}">
        <div class="section-header">
            <h2>
                📋 Incidents du quartier
                <span class="count-badge" th:text="${quartier.nombreIncidents}">0</span>
            </h2>
        </div>
        <p style="color: #6b7280;">
            Ce quartier contient <strong th:text="${quartier.nombreIncidents}">0</strong> incident(s).
            <!-- Vous pouvez ajouter ici une liste détaillée des incidents si nécessaire -->
        </p>
    </div>

    <div class="section" th:if="${quartier.nombreIncidents == 0}">
        <div class="empty-state">
            <div class="icon">📋</div>
            <h3>Aucun incident</h3>
            <p>Ce quartier n'a pas encore d'incidents associés.</p>
        </div>
    </div>
</div>
</body>
</html>
