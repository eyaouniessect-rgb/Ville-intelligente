<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modifier un Quartier - Ville Intelligente</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .form-container {
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            padding: 40px;
            max-width: 600px;
            width: 100%;
        }

        .form-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .form-header .icon {
            font-size: 50px;
            margin-bottom: 15px;
        }

        .form-header h1 {
            color: #1f2937;
            font-size: 28px;
            margin-bottom: 10px;
        }

        .form-header p {
            color: #6b7280;
            font-size: 14px;
        }

        .back-link {
            display: inline-block;
            color: #667eea;
            text-decoration: none;
            margin-bottom: 20px;
            font-weight: 500;
            transition: all 0.3s;
        }

        .back-link:hover {
            color: #5568d3;
            transform: translateX(-5px);
        }

        .alert {
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .alert-error {
            background: #fee2e2;
            color: #991b1b;
            border: 1px solid #fecaca;
        }

        .form-group {
            margin-bottom: 25px;
        }

        .form-group label {
            display: block;
            color: #374151;
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 14px;
        }

        .required {
            color: #ef4444;
            margin-left: 4px;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e5e7eb;
            border-radius: 8px;
            font-size: 14px;
            transition: all 0.3s;
            font-family: inherit;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .form-group textarea {
            resize: vertical;
            min-height: 100px;
        }

        .form-group .help-text {
            font-size: 12px;
            color: #6b7280;
            margin-top: 5px;
        }

        .form-group .error {
            color: #ef4444;
            font-size: 12px;
            margin-top: 5px;
            display: block;
        }

        .form-actions {
            display: flex;
            gap: 15px;
            margin-top: 30px;
        }

        .btn {
            flex: 1;
            padding: 14px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            text-decoration: none;
            text-align: center;
            display: inline-block;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: #f3f4f6;
            color: #374151;
        }

        .btn-secondary:hover {
            background: #e5e7eb;
        }

        @media (max-width: 768px) {
            .form-actions {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
<div class="form-container">
    <a th:href="@{/superadmin/quartiers/{id}(id=${quartier.id})}" class="back-link">← Retour aux détails</a>

    <div class="form-header">
        <div class="icon">✏️</div>
        <h1>Modifier le Quartier</h1>
        <p>Mettez à jour les informations du quartier</p>
    </div>

    <!-- Message d'erreur -->
    <div class="alert alert-error" th:if="${error}">
        <strong>❌ Erreur :</strong> <span th:text="${error}"></span>
    </div>

    <form th:action="@{/superadmin/quartiers/{id}/edit(id=${quartier.id})}" method="post" th:object="${quartier}">

        <!-- Nom du quartier -->
        <div class="form-group">
            <label for="nom">Nom du quartier<span class="required">*</span></label>
            <input type="text"
                   id="nom"
                   name="nom"
                   th:field="*{nom}"
                   placeholder="Ex: Centre-ville, Quartier Nord, Médina..."
                   required
                   minlength="2"
                   maxlength="100">
            <span class="help-text">Nom unique du quartier (2-100 caractères)</span>
            <span class="error" th:if="${#fields.hasErrors('nom')}" th:errors="*{nom}"></span>
        </div>

        <!-- Code Postal -->
        <div class="form-group">
            <label for="codePostal">Code Postal<span class="required">*</span></label>
            <input type="text"
                   id="codePostal"
                   name="codePostal"
                   th:field="*{codePostal}"
                   placeholder="Ex: 1000"
                   required
                   pattern="[0-9]{4}"
                   maxlength="4">
            <span class="help-text">Code postal à 4 chiffres (ex: 1000, 2000...)</span>
            <span class="error" th:if="${#fields.hasErrors('codePostal')}" th:errors="*{codePostal}"></span>
        </div>

        <!-- Actions -->
        <div class="form-actions">
            <a th:href="@{/superadmin/quartiers/{id}(id=${quartier.id})}" class="btn btn-secondary">
                Annuler
            </a>
            <button type="submit" class="btn btn-primary">
                ✓ Enregistrer les modifications
            </button>
        </div>
    </form>
</div>

<script>
    // Validation en temps réel du nom
    document.getElementById('nom').addEventListener('input', function(e) {
        const value = e.target.value;
        const helpText = e.target.nextElementSibling;

        if (value.length < 2) {
            helpText.style.color = '#ef4444';
            helpText.textContent = 'Le nom doit contenir au moins 2 caractères';
        } else if (value.length > 100) {
            helpText.style.color = '#ef4444';
            helpText.textContent = 'Le nom ne peut pas dépasser 100 caractères';
        } else {
            helpText.style.color = '#10b981';
            helpText.textContent = '✓ Nom valide';
        }
    });

    // Validation en temps réel du code postal
    document.getElementById('codePostal').addEventListener('input', function(e) {
        const value = e.target.value;
        const helpText = e.target.nextElementSibling;

        // Ne garder que les chiffres
        e.target.value = value.replace(/[^0-9]/g, '');

        if (value.length !== 4) {
            helpText.style.color = '#ef4444';
            helpText.textContent = 'Le code postal doit contenir exactement 4 chiffres';
        } else {
            helpText.style.color = '#10b981';
            helpText.textContent = '✓ Code postal valide';
        }
    });

</script>
</body>
</html>
