<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestion des Quartiers - Ville Intelligente</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container { max-width: 1400px; margin: 0 auto; }

        .header {
            background: white;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 { color: #1f2937; font-size: 28px; }

        .header-actions { display: flex; gap: 15px; }

        .btn {
            padding: 10px 20px;
            border-radius: 5px;
            text-decoration: none;
            font-weight: bold;
            transition: all 0.3s;
            border: none;
            cursor: pointer;
            display: inline-block;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-back {
            background: #f3f4f6;
            color: #374151;
        }

        .btn:hover { transform: translateY(-2px); }

        .alert {
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .alert-success { background: #d1fae5; color: #065f46; }
        .alert-error { background: #fee2e2; color: #991b1b; }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: white;
            border-radius: 10px;
            padding: 25px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .stat-card h3 {
            color: #6b7280;
            font-size: 14px;
            margin-bottom: 10px;
        }

        .stat-card .number {
            font-size: 36px;
            font-weight: bold;
            color: #1f2937;
        }

        .quartiers-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 20px;
        }

        .quartier-card {
            background: white;
            border-radius: 10px;
            padding: 25px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: transform 0.3s;
        }

        .quartier-card:hover { transform: translateY(-5px); }

        .quartier-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 15px;
        }

        .quartier-name {
            font-size: 20px;
            font-weight: bold;
            color: #1f2937;
        }

        .quartier-description {
            color: #6b7280;
            margin-bottom: 15px;
            min-height: 40px;
        }

        .quartier-info {
            background: #f3f4f6;
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 15px;
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        .info-item {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 13px;
            color: #6b7280;
        }

        .info-item strong {
            color: #1f2937;
        }

        .quartier-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .btn-sm {
            padding: 6px 12px;
            font-size: 13px;
        }

        .btn-view { background: #3b82f6; color: white; }
        .btn-edit { background: #10b981; color: white; }
        .btn-delete { background: #ef4444; color: white; }

        .empty-state {
            background: white;
            border-radius: 10px;
            padding: 60px;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .empty-state h3 {
            color: #1f2937;
            font-size: 24px;
            margin-bottom: 10px;
        }

        .empty-state p { color: #6b7280; }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>🏘️ Gestion des Quartiers</h1>
        <div class="header-actions">
            <a th:href="@{/superadmin/dashboard}" class="btn btn-back">← Retour</a>
            <a th:href="@{/superadmin/quartiers/create}" class="btn btn-primary">+ Créer un Quartier</a>
        </div>
    </div>

    <div class="alert alert-success" th:if="${success}">
        ✓ <span th:text="${success}"></span>
    </div>

    <div class="alert alert-error" th:if="${error}">
        ✗ <span th:text="${error}"></span>
    </div>

    <div class="stats-grid">
        <div class="stat-card">
            <h3>Total Quartiers</h3>
            <div class="number" th:text="${totalQuartiers}">0</div>
        </div>
    </div>

    <div class="quartiers-grid" th:if="${quartiers != null and !quartiers.isEmpty()}">
        <div class="quartier-card" th:each="quartier : ${quartiers}">
            <div class="quartier-header">
                <div class="quartier-name" th:text="${quartier.nom}">Nom du quartier</div>
            </div>

            <div class="quartier-info">
                <div class="info-item">
                    📮 <strong th:text="${quartier.codePostal}">Code Postal</strong>
                </div>
                <div class="info-item">
                    📋 <strong th:text="${quartier.nombreIncidents}">0</strong> incident(s)
                </div>
            </div>

            <div class="quartier-actions">
                <a th:href="@{/superadmin/quartiers/{id}(id=${quartier.id})}"
                   class="btn btn-view btn-sm">Voir</a>

                <a th:href="@{/superadmin/quartiers/{id}/edit(id=${quartier.id})}"
                   class="btn btn-edit btn-sm">Modifier</a>

                <form th:action="@{/superadmin/quartiers/{id}/delete(id=${quartier.id})}"
                      method="post" style="margin: 0;"
                      onsubmit="return confirm('⚠️ Supprimer ce quartier ? Cette action est irréversible.');">
                    <button type="submit" class="btn btn-delete btn-sm">Supprimer</button>
                </form>
            </div>
        </div>
    </div>

    <div class="empty-state" th:if="${quartiers == null or quartiers.isEmpty()}">
        <h3>Aucun quartier</h3>
        <p>Commencez par créer votre premier quartier</p>
        <a th:href="@{/superadmin/quartiers/create}" class="btn btn-primary" style="margin-top: 20px;">
            + Créer un Quartier
        </a>
    </div>
</div>
</body>
</html>
