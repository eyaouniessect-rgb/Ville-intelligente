<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestion des Départements - Ville Intelligente</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container { max-width: 1400px; margin: 0 auto; }

        .header {
            background: white;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 { color: #1f2937; font-size: 28px; }

        .header-actions { display: flex; gap: 15px; }

        .btn {
            padding: 10px 20px;
            border-radius: 5px;
            text-decoration: none;
            font-weight: bold;
            transition: all 0.3s;
            border: none;
            cursor: pointer;
            display: inline-block;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-back {
            background: #f3f4f6;
            color: #374151;
        }

        .btn:hover { transform: translateY(-2px); }

        .alert {
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .alert-success { background: #d1fae5; color: #065f46; }
        .alert-error { background: #fee2e2; color: #991b1b; }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: white;
            border-radius: 10px;
            padding: 25px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .stat-card h3 {
            color: #6b7280;
            font-size: 14px;
            margin-bottom: 10px;
        }

        .stat-card .number {
            font-size: 36px;
            font-weight: bold;
            color: #1f2937;
        }

        .departements-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 20px;
        }

        .dept-card {
            background: white;
            border-radius: 10px;
            padding: 25px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: transform 0.3s;
        }

        .dept-card:hover { transform: translateY(-5px); }

        .dept-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 15px;
        }

        .dept-name {
            font-size: 20px;
            font-weight: bold;
            color: #1f2937;
        }

        .status-badge {
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: bold;
        }

        .status-badge.active { background: #d1fae5; color: #065f46; }
        .status-badge.inactive { background: #fee2e2; color: #991b1b; }

        .dept-description {
            color: #6b7280;
            margin-bottom: 15px;
            min-height: 40px;
        }

        .dept-stats {
            background: #f3f4f6;
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 15px;
        }

        .dept-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .btn-sm {
            padding: 6px 12px;
            font-size: 13px;
        }

        .btn-view { background: #3b82f6; color: white; }
        .btn-edit { background: #10b981; color: white; }
        .btn-toggle { background: #f59e0b; color: white; }
        .btn-delete { background: #ef4444; color: white; }

        .empty-state {
            background: white;
            border-radius: 10px;
            padding: 60px;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .empty-state h3 {
            color: #1f2937;
            font-size: 24px;
            margin-bottom: 10px;
        }

        .empty-state p { color: #6b7280; }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>🏢 Gestion des Départements</h1>
        <div class="header-actions">
            <a th:href="@{/superadmin/dashboard}" class="btn btn-back">← Retour</a>
            <a th:href="@{/superadmin/departements/create}" class="btn btn-primary">+ Créer un Département</a>
        </div>
    </div>

    <div class="alert alert-success" th:if="${success}">
        ✓ <span th:text="${success}"></span>
    </div>

    <div class="alert alert-error" th:if="${error}">
        ✗ <span th:text="${error}"></span>
    </div>

    <div class="stats-grid">
        <div class="stat-card">
            <h3>Total Départements</h3>
            <div class="number" th:text="${totalDepartements}">0</div>
        </div>
        <div class="stat-card">
            <h3>Total Services</h3>
            <div class="number" th:text="${totalServices}">0</div>
        </div>
    </div>

    <div class="departements-grid" th:if="${departements != null and !departements.isEmpty()}">
        <div class="dept-card" th:each="dept : ${departements}">
            <div class="dept-header">
                <div class="dept-name" th:text="${dept.nom}">Nom du département</div>
            </div>

            <div class="dept-description" th:text="${dept.description} ?: 'Aucune description'">
                Description du département
            </div>

            <div class="dept-stats">
                <strong th:text="${dept.services.size()}">0</strong> service(s)
            </div>

            <div class="dept-actions">
                <a th:href="@{/superadmin/departements/{id}(id=${dept.id})}"
                   class="btn btn-view btn-sm">Voir</a>

                <a th:href="@{/superadmin/departements/{id}/edit(id=${dept.id})}"
                   class="btn btn-edit btn-sm">Modifier</a>

                <form th:action="@{/superadmin/departements/{id}/toggle-status(id=${dept.id})}"
                      method="post" style="margin: 0;">
                    <button type="submit" class="btn btn-toggle btn-sm"
                            th:text="${dept.actif} ? 'Désactiver' : 'Activer'">Toggle</button>
                </form>

                <form th:action="@{/superadmin/departements/{id}/delete(id=${dept.id})}"
                      method="post" style="margin: 0;"
                      onsubmit="return confirm('⚠️ Supprimer ce département ? Cette action est irréversible.');">
                    <button type="submit" class="btn btn-delete btn-sm">Supprimer</button>
                </form>
            </div>
        </div>
    </div>

    <div class="empty-state" th:if="${departements == null or departements.isEmpty()}">
        <h3>Aucun département</h3>
        <p>Commencez par créer votre premier département</p>
        <a th:href="@{/superadmin/departements/create}" class="btn btn-primary" style="margin-top: 20px;">
            + Créer un Département
        </a>
    </div>
</div>
</body>
</html>
