<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Incidents Non Assignés - Ville Intelligente</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        /* Header */
        .header {
            background: white;
            border-radius: 15px;
            padding: 25px 30px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header-left h1 {
            color: #1f2937;
            font-size: 28px;
            margin-bottom: 5px;
        }

        .header-left p {
            color: #6b7280;
            font-size: 14px;
        }

        .department-badge {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 14px;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .user-badge {
            background: #f3f4f6;
            color: #374151;
            padding: 10px 18px;
            border-radius: 10px;
            font-weight: 600;
            font-size: 14px;
        }

        .logout-btn {
            background: #ef4444;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
        }

        .logout-btn:hover {
            background: #dc2626;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(239, 68, 68, 0.3);
        }

        /* Bouton retour */
        .back-btn {
            display: inline-block;
            margin-bottom: 20px;
            text-decoration: none;
            color: white;
            font-weight: 600;
            background: rgba(255, 255, 255, 0.2);
            padding: 10px 20px;
            border-radius: 8px;
            transition: all 0.3s;
        }

        .back-btn:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: translateY(-2px);
        }

        /* Responsive */
        @media (max-width: 768px) {
            .header {
                flex-direction: column;
                gap: 20px;
                text-align: center;
            }
        }
    </style>

    <!-- Inclure les styles du fragment -->
    <th:block th:replace="~{fragments/incidents-table :: incidentsStyles}"></th:block>
</head>
<body>
<div class="container">
    <!-- Header -->
    <div class="header">
        <div class="header-left">
            <h1>🔔 Incidents Non Assignés</h1>
            <p>Département : <span class="department-badge" th:text="${admin.departement.nom}">Département</span></p>
        </div>
        <div class="user-info">
            <span class="user-badge" th:text="${admin.prenom + ' ' + admin.nom}">Admin</span>
            <form th:action="@{/logout}" method="post" style="margin: 0;">
                <button type="submit" class="logout-btn">Déconnexion</button>
            </form>
        </div>
    </div>

    <!-- Bouton Retour -->
    <a th:href="@{/admin/dashboard}" class="back-btn">← Retour au Dashboard</a>

    <!-- Incidents Table (Fragment) SANS barre de recherche -->
    <div th:replace="~{fragments/incidents-table :: incidentsTable(${incidents}, false, ${totalPages}, ${currentPage}, '/admin/incidents/signales')}"></div>
</div>

<!-- Modal d'assignation (Fragment) -->
<div th:replace="~{fragments/incidents-table :: assignModal(${services}, ${priorites})}"></div>

<!-- Scripts (Fragment) -->
<script th:replace="~{fragments/incidents-table :: incidentsScripts}"></script>

</body>
</html>
