<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Incidents Non Assignés - Ville Intelligente</title>

    <link rel="stylesheet" th:href="@{/css/style.css}">

    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            background: white;
            border-radius: 15px;
            padding: 25px 30px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header-left h1 {
            color: #1f2937;
            font-size: 28px;
        }

        .department-badge {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 6px 14px;
            border-radius: 999px;
            font-size: 14px;
            font-weight: bold;
        }

        .user-info {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .user-badge {
            background: #f3f4f6;
            padding: 8px 14px;
            border-radius: 10px;
            font-weight: 600;
        }

        .logout-btn {
            background: #ef4444;
            color: white;
            border: none;
            padding: 8px 18px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
        }

        .logout-btn:hover {
            background: #dc2626;
        }

        .back-btn {
            display: inline-block;
            margin-bottom: 20px;
            text-decoration: none;
            color: white;
            font-weight: 600;
            background: rgba(255,255,255,0.25);
            padding: 10px 18px;
            border-radius: 8px;
        }

        .back-btn:hover {
            background: rgba(255,255,255,0.35);
        }
    </style>

    <!-- ✅ Styles du fragment -->
    <th:block th:replace="~{fragments/incidents-table :: incidentsStyles}"></th:block>
</head>

<body>

<div class="container">

    <!-- ===== HEADER ===== -->
    <div class="header">
        <div class="header-left">
            <h1>🔔 Incidents Non Assignés</h1>
            <p>
                Département :
                <span class="department-badge"
                      th:text="${admin.departement.nom}">
                    Département
                </span>
            </p>
        </div>

        <div class="user-info">
            <span class="user-badge"
                  th:text="${admin.prenom + ' ' + admin.nom}">
                Admin
            </span>

            <form th:action="@{/logout}" method="post">
                <button class="logout-btn" type="submit">Déconnexion</button>
            </form>
        </div>
    </div>

    <!-- ===== RETOUR ===== -->
    <a th:href="@{/admin/dashboard}" class="back-btn">
        ← Retour au Dashboard
    </a>

    <!-- ===== TABLE DES INCIDENTS (FRAGMENT) ===== -->
    <div th:replace="~{fragments/incidents-table
        :: incidentsTable(
            ${incidents},
            false,
            0,
            0,
            '/admin/incidents/non-assignes'
        )}">
    </div>

</div>

<!-- ===== MODAL D’ASSIGNATION (FRAGMENT) ===== -->
<div th:replace="~{fragments/incidents-table
    :: assignModal(${services}, ${priorites})}">
</div>

<!-- ===== SCRIPTS (FRAGMENT) ===== -->
<script th:replace="~{fragments/incidents-table
    :: incidentsScripts}">
</script>

</body>
</html>
