<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Détails Incident - Ville Intelligente</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        /* Header */
        .header {
            background: white;
            border-radius: 15px;
            padding: 25px 30px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header-left h1 {
            color: #1f2937;
            font-size: 28px;
            margin-bottom: 5px;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .user-badge {
            background: #f3f4f6;
            color: #374151;
            padding: 10px 18px;
            border-radius: 10px;
            font-weight: 600;
            font-size: 14px;
        }

        .logout-btn {
            background: #ef4444;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
            text-decoration: none;
            display: inline-block;
        }

        .logout-btn:hover {
            background: #dc2626;
        }

        /* Back button */
        .back-btn {
            display: inline-block;
            margin-bottom: 20px;
            text-decoration: none;
            color: white;
            font-weight: 600;
            background: rgba(255, 255, 255, 0.2);
            padding: 10px 20px;
            border-radius: 8px;
            transition: all 0.3s;
        }

        .back-btn:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        /* Details card */
        .details-card {
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        .details-header {
            border-bottom: 2px solid #e5e7eb;
            padding-bottom: 20px;
            margin-bottom: 25px;
        }

        .details-header h2 {
            color: #1f2937;
            font-size: 24px;
            margin-bottom: 10px;
        }

        .incident-id {
            color: #667eea;
            font-weight: bold;
            font-size: 18px;
        }

        .details-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .detail-item {
            background: #f9fafb;
            padding: 20px;
            border-radius: 10px;
        }

        .detail-item label {
            display: block;
            color: #6b7280;
            font-size: 12px;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: 600;
        }

        .detail-item .value {
            color: #1f2937;
            font-weight: 600;
            font-size: 16px;
        }

        .description-section {
            background: #f9fafb;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .description-section h3 {
            color: #1f2937;
            margin-bottom: 10px;
            font-size: 16px;
        }

        .description-section p {
            color: #374151;
            line-height: 1.6;
        }

        .status-badge {
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
            display: inline-block;
        }

        .status-signale { background: #dbeafe; color: #1e40af; }
        .status-pris-en-charge { background: #fef3c7; color: #92400e; }
        .status-en-resolution { background: #fed7aa; color: #9a3412; }
        .status-resolu { background: #d1fae5; color: #065f46; }
        .status-cloture { background: #e5e7eb; color: #374151; }

        .priority-badge {
            padding: 8px 16px;
            border-radius: 15px;
            font-size: 14px;
            font-weight: 600;
        }

        .priority-haute { background: #fee2e2; color: #991b1b; }
        .priority-moyenne { background: #fed7aa; color: #9a3412; }
        .priority-basse { background: #dbeafe; color: #1e40af; }

        .actions-section {
            margin-top: 30px;
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        .action-btn {
            padding: 12px 24px;
            border-radius: 8px;
            text-decoration: none;
            color: white;
            font-weight: 600;
            transition: all 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            border: none;
            cursor: pointer;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .btn-success {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
        }

        .btn-warning {
            background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
        }

        .action-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        /* Image section */
        .image-section {
            margin-top: 20px;
        }

        .image-section img {
            max-width: 100%;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>
<div class="container">
    <!-- Header -->
    <div class="header">
        <div class="header-left">
            <h1>👁️ Détails de l'incident</h1>
        </div>
        <div class="user-info">
            <span class="user-badge" th:text="${admin.prenom + ' ' + admin.nom}">Admin</span>
            <form th:action="@{/logout}" method="post" style="margin: 0;">
                <button type="submit" class="logout-btn">Déconnexion</button>
            </form>
        </div>
    </div>

    <!-- Back button -->
    <a href="javascript:history.back()" class="back-btn">← Retour</a>

    <!-- Details Card -->
    <div class="details-card">
        <div class="details-header">
            <h2>Incident <span class="incident-id" th:text="${'#' + incident.id}">#001</span></h2>
        </div>

        <!-- Grid de détails -->
        <div class="details-grid">


            <div class="detail-item">
                <label>🏘️ Quartier</label>
                <div class="value" th:text="${incident.quartier?.nom ?: 'Non défini'}">Quartier</div>
            </div>

            <div class="detail-item">
                <label>🏢 Service</label>
                <div class="value" th:text="${incident.service?.nom ?: 'Non assigné'}">Service</div>
            </div>

            <div class="detail-item">
                <label>👤 Citoyen</label>
                <div class="value" th:text="${incident.citoyen.prenom + ' ' + incident.citoyen.nom}">Citoyen</div>
            </div>

            <div class="detail-item">
                <label>👮 Agent assigné</label>
                <div class="value" th:text="${incident.agent != null ? incident.agent.prenom + ' ' + incident.agent.nom : 'Non assigné'}">Agent</div>
            </div>

            <div class="detail-item">
                <label>📅 Date de déclaration</label>
                <div class="value" th:text="${#temporals.format(incident.dateDeclaration, 'dd/MM/yyyy HH:mm')}">Date</div>
            </div>

            <div class="detail-item">
                <label>📊 Statut</label>
                <div>
                    <span class="status-badge"
                          th:classappend="${'status-' + #strings.toLowerCase(#strings.replace(incident.statut, '_', '-'))}"
                          th:text="${incident.statut}">Statut</span>
                </div>
            </div>

            <div class="detail-item">
                <label>⚠️ Priorité</label>
                <div>
                    <span th:if="${incident.priorite != null}"
                          class="priority-badge"
                          th:classappend="${incident.priorite.name() == 'HAUTE' ? ' priority-haute' :
                                           incident.priorite.name() == 'MOYENNE' ? ' priority-moyenne' :
                                           ' priority-basse'}"
                          th:text="${incident.priorite.name()}">
                    </span>
                    <span th:if="${incident.priorite == null}" class="value">Non définie</span>
                </div>
            </div>
        </div>

        <!-- Description -->
        <div class="description-section">
            <h3>📝 Description</h3>
            <p th:text="${incident.description}">Description de l'incident</p>
        </div>
        <!-- Photos (si disponibles) -->
        <!-- Photos (si disponibles) -->
        <div class="image-section" th:if="${incident.photos != null and !incident.photos.isEmpty()}">
            <h3 style="margin-bottom: 15px; color: #1f2937;">📸 Photos de l'incident</h3>
            <div style="display: flex; flex-wrap: wrap; gap: 15px;">
                <img th:each="photo : ${incident.photos}"
                     th:src="@{'/' + ${photo.cheminStockage}}"
                     th:alt="${photo.nomFichier}"
                     style="width: 200px; border-radius: 10px; box-shadow: 0 5px 15px rgba(0,0,0,0.1);">
            </div>
        </div>



        <!-- Actions -->
        <div class="actions-section">
            <a th:href="@{/admin/dashboard}" class="action-btn btn-primary">
                🏠 Retour au Dashboard
            </a>

            <button th:if="${incident.agent == null}"
                    class="action-btn btn-warning"
                    onclick="alert('Utilisez le bouton Assigner dans le tableau')">
                📝 Assigner cet incident
            </button>


        </div>
    </div>
</div>
</body>
</html>
