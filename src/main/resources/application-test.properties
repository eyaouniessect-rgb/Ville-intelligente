# ===============================
# DATASOURCE - MYSQL TEST
# ===============================
spring.datasource.url=jdbc:mysql://localhost:3306/gestion_incidents_test?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# JPA / HIBERNATE
# ===============================
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# ===============================
# SECURITY / EMAIL (D\u00C9SACTIV\u00C9S POUR LES TESTS)
# ===============================
spring.mail.host=
spring.mail.port=
spring.mail.username=
spring.mail.password=
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

spring.security.oauth2.client.registration.google.client-id=
spring.security.oauth2.client.registration.google.client-secret=

# ===============================
# THYMELEAF
# ===============================
spring.thymeleaf.cache=false

# ===============================
# UPLOADS (FAKE PATH)
# ===============================
uploads.path=target/test-uploads/

# ===============================
# APPLICATION
# ===============================
app.base-url=http://localhost:8080
